name: Claude Review

on:
  workflow_call:

jobs:
  review:
    # 公開リポジトリでは誰でもコメントできるため、リポジトリの関係者
    # （OWNER/MEMBER/COLLABORATOR）と実装用ボット（claudeapp-zaki3mymy[bot]）の
    # コメントでのみ起動する。ボットの author_association は NONE になるため、
    # ログイン名で個別に許可している。
    if: |
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) ||
      github.event.comment.user.login == 'claudeapp-zaki3mymy[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Claude global config
        run: |
          mkdir -p ~/.claude
          curl -fsSL https://raw.githubusercontent.com/zaki3mymy/dotfiles/main/home/dot_claude/CLAUDE.md \
            -o ~/.claude/CLAUDE.md || true

      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.CLAUDE_REVIEW_APP_ID }}
          private-key: ${{ secrets.CLAUDE_REVIEW_APP_PRIVATE_KEY }}

      - uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          allowed_bots: "claudeapp-zaki3mymy"
          trigger_phrase: "@claude review"
          claude_args: "--allowedTools Bash,Read,Glob,Grep"
          prompt: |
            PR #${{ github.event.issue.number }} をレビューしてください。
            バックグラウンドエージェントは使用せず、すべての作業を直接実行してください。

            ## 事前確認①：CIチェックの状態

            まず以下のコマンドでCIチェックの結果を取得してください：

            ```bash
            gh pr checks ${{ github.event.issue.number }} --repo ${{ github.repository }}
            ```

            **失敗（failure/error）しているチェックがある場合は、コードレビューの結果にかかわらず REQUEST_CHANGES とし、レビューサマリに失敗しているチェック名と対応が必要な旨を明記してください。Approveしてはいけません。**

            ---

            ## 事前確認②：未解決スレッドの有無

            次に以下のコマンドで未解決レビュースレッドを取得してください：

            ```bash
            gh api graphql -f query='
            query {
              repository(owner: "${{ github.repository_owner }}", name: "${{ github.event.repository.name }}") {
                pullRequest(number: ${{ github.event.issue.number }}) {
                  reviewThreads(first: 100) {
                    nodes {
                      id
                      isResolved
                      comments(first: 1) {
                        nodes {
                          body
                          path
                          line
                        }
                      }
                    }
                  }
                }
              }
            }'
            ```

            ---

            ### 未解決スレッドがある場合（再レビュー）

            各スレッドについて、最新の差分でその指摘が対応済みかを確認してください。

            **すべての指摘が対応済みかつCIがすべてパスしている場合：**

            1. 未解決スレッドをすべて resolve する：
               ```bash
               gh api graphql -f query='mutation { resolveReviewThread(input: {threadId: "THREAD_ID"}) { thread { id isResolved } } }'
               ```
            2. PR を approve する：
               ```bash
               gh pr review ${{ github.event.issue.number }} --approve \
                 --body "指摘事項がすべて対応されていることを確認しました。LGTM"
               ```

            **すべての指摘が対応済みだがCIが失敗している場合：**

            対応済みスレッドは resolve した上で、CIの失敗を REQUEST_CHANGES でコメントしてください。

            **未対応の指摘が残っている場合：**

            対応済みスレッドは resolve した上で、残存する問題点を再度 REQUEST_CHANGES でコメントしてください：
            ```bash
            gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}/reviews \
              --method POST \
              --field body="## レビューサマリ\n\n..." \
              --field event="REQUEST_CHANGES" \
              --field "comments[][path]=対象ファイルパス" \
              --field "comments[][line]=行番号" \
              --field "comments[][body]=指摘内容"
            ```

            ---

            ### 未解決スレッドがない場合（初回レビュー）

            差分を確認し、以下の観点でレビューしてください：
            - 実装の正確さ（Issue の要件を満たしているか）
            - コードの品質・可読性
            - 潜在的なバグやエッジケース

            問題を発見した場合は `gh api` を使って行コメントとサマリの両方を含むレビューをサブミットしてください：

            ```bash
            gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}/reviews \
              --method POST \
              --field body="## レビューサマリ\n\n全体的な所見" \
              --field event="REQUEST_CHANGES" \
              --field "comments[][path]=対象ファイルパス" \
              --field "comments[][line]=行番号" \
              --field "comments[][body]=その行への具体的な指摘"
            ```

            コードに問題がなくかつCIがすべてパスしている場合は以下でApproveしてください：

            ```bash
            gh pr review ${{ github.event.issue.number }} --approve --body "LGTM"
            ```

            コードに問題はないがCIが失敗している場合は、CIの失敗を REQUEST_CHANGES でコメントしてください。
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
