name: Claude Implement

on:
  workflow_call:
    inputs:
      issue_number:
        description: "Issue番号"
        required: true
        type: string

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Claude global config
        run: |
          mkdir -p ~/.claude
          curl -fsSL https://raw.githubusercontent.com/zaki3mymy/dotfiles/main/home/dot_claude/CLAUDE.md \
            -o ~/.claude/CLAUDE.md || true

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}

      - name: Get issue data
        id: issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          NUMBER=${{ inputs.issue_number }}
          ISSUE_JSON=$(gh api repos/${{ github.repository }}/issues/$NUMBER 2>/dev/null) || {
            echo "::error::Issue #$NUMBER が見つかりません"
            exit 1
          }
          if echo "$ISSUE_JSON" | jq -e '.pull_request' &>/dev/null; then
            echo "::error::#$NUMBER はIssueではなくPRです"
            exit 1
          fi
          STATE=$(echo "$ISSUE_JSON" | jq -r '.state')
          if [ "$STATE" = "closed" ]; then
            echo "::error::Issue #$NUMBER はすでにCloseされています"
            exit 1
          fi
          TITLE=$(echo "$ISSUE_JSON" | jq -r '.title')
          BODY=$(echo "$ISSUE_JSON" | jq -r '.body // ""')
          BRANCH="feature/issue-${NUMBER}"
          echo "number=$NUMBER" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Configure git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - uses: anthropics/claude-code-action@4845bacbb38b3c4b15d948f035349786f678e068 # v1.0.267
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: "--allowedTools Bash,Read,Write,Edit,Glob,Grep"
          prompt: |
            以下のGitHub Issueを実装してください。

            Issue #${{ steps.issue.outputs.number }}: ${{ steps.issue.outputs.title }}

            ${{ steps.issue.outputs.body }}

            バックグラウンドエージェントは使用せず、すべての作業を直接実行してください。

            ## 作業手順

            1. ブランチ `${{ steps.issue.outputs.branch }}` を作成して実装する（他のブランチ名は使わないこと）
            2. コミット・プッシュする
            3. 以下のコマンドでPRを作成する（`BODY` には実装の説明を記載すること）：
               ```bash
               BODY=$(cat <<'EOF_BODY'
               Closes #${{ steps.issue.outputs.number }}

               ## 実装内容

               （実装方針・設計上の決定とその理由を記載）

               ## 実装中の発見

               （想定外の挙動、既存コードの注意点、今後の課題など気づいたことがあれば記載）
               EOF_BODY
               )
               gh pr create \
                 --title "${{ steps.issue.outputs.title }}" \
                 --body "$BODY" \
                 --head "${{ steps.issue.outputs.branch }}"
               ```
            4. 以下のコマンドでレビュー依頼コメントを投稿する：
               ```bash
               gh pr comment ${{ steps.issue.outputs.number }} --body "@claude review このPRをレビューしてください"
               ```
               ※ PRの番号は `gh pr view ${{ steps.issue.outputs.branch }} --json number --jq '.number'` で取得すること
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
