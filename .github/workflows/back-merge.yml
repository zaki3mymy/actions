name: Back-merge

# リリース先のブランチ（既定は main）を、開発のブランチ（既定は develop）に取り込む。
# main → develop の PR を作り、マージコミットでマージする。
#
# タグは main のマージコミット（develop → main のリリース PR のマージ）に打つので、
# 取り込まないと develop の履歴からタグを辿れず、develop の git describe --tags などが古いタグを基準にしてしまう。
#
# - 本番のリリースの後に、呼び出し元の CD から呼ぶ
# - PR の作成とマージは、取り込み専用の GitHub App のトークンで行う（シークレットの BACK_MERGE_APP_CLIENT_ID・BACK_MERGE_APP_PRIVATE_KEY）。
#   develop への PR はスカッシュだけに制限していても、この App を develop の ruleset の対象外（bypass_mode = "exempt"）にしておけば、
#   マージコミットでマージできる。個人アカウントのリポジトリでは GITHUB_TOKEN をバイパスに入れられないため、App を使う
# - PR は main から直接ではなく、main と同じコミットを指す一時的なブランチから作る
#   （マージ後にブランチを自動で削除する設定のとき、main を head にしないため）
# - PR は skip-release-notes を付けるので、次のリリースのバージョンの計算とノートには含まれない
# - 自動マージに失敗したとき（コンフリクトなど）は PR を開いたまま残し、ジョブを失敗させる。
#   PR はリポジトリのオーナーにアサインするので、通知でも気づける
# - App で作った PR なので、CI や PR のタイトルのチェックも起動する（マージはそれを待たない）
#
# 呼び出し元のジョブには `permissions: contents: read` があればよい（書き込みは App のトークンで行う）。
on:
  workflow_call:
    inputs:
      from:
        description: '取り込む元のブランチ（リリース先）'
        required: false
        type: string
        default: 'main'
      to:
        description: '取り込む先のブランチ（開発のブランチ）'
        required: false
        type: string
        default: 'develop'
    secrets:
      BACK_MERGE_APP_CLIENT_ID:
        description: '取り込み専用の GitHub App の Client ID（App ID とは別の値。例: Iv23...）'
        required: true
      BACK_MERGE_APP_PRIVATE_KEY:
        description: '取り込み専用の GitHub App の秘密鍵'
        required: true

jobs:
  back-merge:
    runs-on: ubuntu-latest
    name: Merge ${{ inputs.from }} into ${{ inputs.to }}
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.BACK_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.BACK_MERGE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # ブランチの push も App で行う
          token: ${{ steps.app-token.outputs.token }}

      - name: Open and merge a pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # 入力はスクリプトに直接埋め込まず、環境変数で渡す（コマンドの注入を防ぐため）
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          git fetch origin "$FROM" "$TO"
          from_sha=$(git rev-parse "origin/$FROM")
          if git merge-base --is-ancestor "$from_sha" "origin/$TO"; then
            echo "$TO already contains $FROM ($from_sha). Nothing to do."
            exit 0
          fi

          short=${from_sha::7}
          branch="back-merge/$short"
          # 元のブランチと同じコミットを指すブランチを作る（再実行でブランチがすでにあっても同じコミットなら成功する）
          git push origin "$from_sha:refs/heads/$branch"

          url=$(gh pr list --base "$TO" --head "$branch" --state open --json url --jq '.[0].url // ""')
          if [[ -z "$url" ]]; then
            url=$(gh pr create \
              --base "$TO" \
              --head "$branch" \
              --title "release: $FROM を $TO に取り込む ($short)" \
              --label skip-release-notes \
              --assignee "$GITHUB_REPOSITORY_OWNER" \
              --body "$FROM（$from_sha）を $TO に取り込みます。リリースのタグを $TO の履歴からも辿れるようにするためです。

          「$GITHUB_WORKFLOW」のワークフローが自動で作りました。自動のマージに失敗したときは、内容を確認して **「Create a merge commit」でマージ**してください（スカッシュでは取り込めません）。

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          fi
          echo "Pull request: $url"

          # 作った直後は、マージできるかの判定が終わっていないことがあるので、何回か試す
          for _ in 1 2 3 4 5; do
            if gh pr merge "$url" --merge; then
              echo "Merged $url"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$FROM → $TO の PR を自動でマージできませんでした。$url を確認して、マージコミットでマージしてください"
          exit 1
