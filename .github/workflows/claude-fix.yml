name: Claude Fix

on:
  workflow_call:

jobs:
  fix:
    # 公開リポジトリでは誰でもレビュー・コメントできるため、リポジトリの関係者
    # （OWNER/MEMBER/COLLABORATOR）とレビュー用ボット（claudereview-zaki3mymy[bot]）の
    # レビュー・コメントでのみ起動する。ボットの author_association は NONE になるため、
    # ログイン名で個別に許可している。
    if: |
      (
        github.event_name == 'pull_request_review' &&
        (
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association) ||
          github.event.review.user.login == 'claudereview-zaki3mymy[bot]'
        )
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        (
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) ||
          github.event.comment.user.login == 'claudereview-zaki3mymy[bot]'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Claude global config
        run: |
          mkdir -p ~/.claude
          curl -fsSL https://raw.githubusercontent.com/zaki3mymy/dotfiles/main/home/dot_claude/CLAUDE.md \
            -o ~/.claude/CLAUDE.md || true

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}

      - name: Get review context
        id: review
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request_review" ]; then
            SUMMARY=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews/${{ github.event.review.id }} --jq '.body')
            COMMENTS=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments \
              --jq "[.[] | select(.pull_request_review_id == ${{ github.event.review.id }}) | {path: .path, line: .line, body: .body, id: .id}]")
          else
            SUMMARY=""
            COMMENTS=$(gh api repos/${{ github.repository }}/pulls/comments/${{ github.event.comment.id }} \
              --jq "[{path: .path, line: .line, body: .body, id: .id}]")
          fi
          {
            echo "summary<<EOF"
            echo "$SUMMARY"
            echo "EOF"
            echo "comments<<EOF"
            echo "$COMMENTS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Configure git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          allowed_bots: "claudereview-zaki3mymy"
          claude_args: "--allowedTools Bash,Read,Write,Edit,Glob,Grep"
          prompt: |
            PR #${{ github.event.pull_request.number }} にレビューで指摘がありました。内容を修正してください。
            バックグラウンドエージェントは使用せず、すべての作業を直接実行してください。

            ## レビューサマリ

            ${{ steps.review.outputs.summary }}

            ## 行コメント（path/line/body/idを含むJSON）

            ${{ steps.review.outputs.comments }}

            ## 修正後にやること

            1. 修正内容をコミット・プッシュする
            2. PRに修正サマリをコメントする：
               ```bash
               gh pr comment ${{ github.event.pull_request.number }} --body "## 修正内容\n\n..."
               ```
            3. 各行コメントに返信する（JSONの `id` フィールドを使用）：
               ```bash
               gh api repos/${{ github.repository }}/pulls/comments/COMMENT_ID/replies \
                 --method POST \
                 --field body="この指摘への対応内容"
               ```
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
