name: actionlint

# このリポジトリのすべてのワークフローを actionlint で検査する（このリポジトリ自身の CI。再利用ワークフローではない）。
on:
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: "1.7.12"
  # download-actionlint.bash を取ってくるコミット（v1.7.12 のタグ）
  ACTIONLINT_SCRIPT_SHA: "914e7df21a07ef503a81201c76d2b11c789d3fca"

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/$ACTIONLINT_SCRIPT_SHA/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint -color
